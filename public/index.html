<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b3ff2"><title>Espetinho do Reinaldo</title><link rel="stylesheet" href="/style.css"></head><body><header><div><b>🍢 ESPETINHO DO REINALDO</b><small>Pedidos online</small></div><button id="cartBtn">🛒 <span id="cartCount">0</span></button></header><main><section class="hero"><h1>Faça seu pedido</h1><p>Escolha os produtos, monte seu carrinho e envie o pedido.</p></section><div id="cats" class="cats"></div><div id="products" class="grid"></div></main><div id="cart" class="drawer hidden"><div class="drawerHead"><h2>Seu pedido</h2><button onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="total" id="cartTotal">Total: R$ 0,00</div><div class="form"><input id="name" placeholder="Seu nome"><input id="phone" placeholder="WhatsApp"><select id="type"><option value="balcao">Retirar no balcão</option><option value="mesa">Consumir no local</option><option value="entrega">Entrega</option></select><input id="address" placeholder="Endereço (se entrega)"><select id="payment"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="fiado">Fiado / Promissória</option></select><textarea id="notes" placeholder="Observações"></textarea><button class="primary" onclick="sendOrder()">ENVIAR PEDIDO</button></div></div><div id="toast"></div><script src="/app.js"></script></body></html>
