<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14251e"><title>Garçom | Espetinho do Reinaldo</title><link rel="stylesheet" href="/garcom.css"></head><body><header><div><small>ESPETINHO DO REINALDO</small><h1>Área do Garçom</h1></div><button id="logout" class="ghost hidden">Sair</button></header><main><section id="login" class="panel"><h2>Entrar</h2><label>Número do garçom<input id="number" inputmode="numeric" value="01" autocomplete="username"></label><label>PIN de acesso<input id="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="current-password" placeholder="4 ou 6 dígitos"></label><button id="loginBtn" class="primary">Entrar no sistema</button><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="welcome"><div><b id="who"></b><span>Área de atendimento</span></div><button id="refresh" class="ghost">Atualizar</button></div><div class="tabs"><button class="tab active" data-tab="orders">Comandas</button><button class="tab" data-tab="new">Nova comanda</button></div><section id="orders" class="panel tabbody"><h2>Comandas abertas</h2><div id="commandList" class="command-list"></div></section><section id="new" class="panel tabbody hidden"><h2>Abrir comanda</h2><label>Nome do cliente (opcional)<input id="customer" placeholder="Nome do cliente"></label><label>Mesa / identificação (opcional)<input id="table" placeholder="Ex.: Mesa 3"></label><button id="openCommand" class="primary">Abrir comanda</button><p id="newMsg" class="msg"></p></section><section id="detail" class="panel hidden"><button id="back" class="ghost">← Voltar às comandas</button><h2 id="commandTitle">Comanda</h2><p id="commandMeta" class="muted"></p><div id="itemList"></div><div class="total" id="commandTotal"></div><hr><h3>Adicionar produtos</h3><input id="search" placeholder="Buscar produto..." aria-label="Buscar produto"><div id="categories" class="categories"></div><div id="products" class="products"></div><div class="cart" id="cart"></div><button id="sendItems" class="primary" disabled>Enviar itens para a comanda</button><p id="itemMsg" class="msg"></p><button id="requestClose" class="danger">Solicitar fechamento da conta</button></section></section></main><div id="toast" role="status"></div><script src="/garcom.js"></script></body></html>
