<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retirada de Fichas — Espetinho do Reinaldo</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f3f4f6;margin:0;padding:14px}.wrap{max-width:900px;margin:auto}.box{background:white;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:120px;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}.btn{padding:11px 14px;border:0;border-radius:8px;background:#222;color:#fff;font-weight:700}.ticket{border:1px solid #ddd;border-radius:10px;padding:12px;margin:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.ticket.pending{border-left:5px solid #d18b00}.ticket.redeemed{border-left:5px solid #238044;background:#f5fbf6}.ticket small{display:block;color:#666;margin-top:4px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats b{background:#eee;padding:8px 12px;border-radius:8px}.hide{display:none}
</style></head><body><main class="wrap"><h1>ESPETINHO DO REINALDO</h1><h2>Retirada de Fichas — Eventos</h2>
<section id="login" class="box"><h3>Acesso do garçom</h3><div class="row"><input id="number" value="01" placeholder="Número"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"></div><button class="btn" onclick="login()" style="margin-top:10px">ENTRAR</button><p id="loginMsg"></p></section>
<section id="app" class="hide"><div class="box"><div class="row"><strong id="who"></strong><button class="btn" onclick="logout()">SAIR</button></div><div class="stats" id="stats"></div><div class="row" style="margin-top:12px"><input id="search" placeholder="Buscar venda, cliente ou número da ficha"><button class="btn" onclick="loadTickets()">BUSCAR</button></div><div class="row" style="margin-top:8px"><button class="btn" onclick="filter='pending';render()">PENDENTES</button><button class="btn" onclick="filter='all';render()">TODAS</button><button class="btn" onclick="loadTickets()">ATUALIZAR</button></div></div><div id="tickets"></div></section>
</main><script>
let token=localStorage.getItem('waiter_token')||'',tickets=[],filter='pending';const $=id=>document.getElementById(id);
async function call(url,opt={}){opt.headers={...(opt.headers||{}),'x-waiter-token':token,'Content-Type':'application/json'};const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function login(){try{const r=await fetch('/api/garcom/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:$('number').value,pin:$('pin').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('waiter_token',token);await start(d.waiter);}catch(e){$('loginMsg').textContent=e.message;}}
async function start(waiter){$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='Garçom: '+(waiter?.name||'');try{const me=await call('/api/garcom/me');$('who').textContent='Garçom: '+me.waiter.name;await loadTickets();}catch(e){logout();$('loginMsg').textContent=e.message;}}
function logout(){token='';localStorage.removeItem('waiter_token');$('app').classList.add('hide');$('login').classList.remove('hide');}
async function loadTickets(){try{tickets=await call('/api/garcom/pickup-tickets?search='+encodeURIComponent($('search').value||''));render();}catch(e){alert(e.message);}}
function render(){const pending=tickets.filter(x=>x.status==='pending').length,done=tickets.length-pending;$('stats').innerHTML='<b>Fichas: '+tickets.length+'</b><b>Pendentes: '+pending+'</b><b>Retiradas: '+done+'</b>';const rows=filter==='pending'?tickets.filter(x=>x.status==='pending'):tickets;$('tickets').innerHTML=rows.length?rows.map(t=>`<article class="ticket ${t.status}"><div><strong>Venda nº ${String(t.sale_number).padStart(3,'0')} — Ficha ${t.ticket_no}/${t.ticket_total}</strong><div>${t.product_name}</div><small>Cliente: ${t.customer||'Não identificado'} | Pagamento: ${t.payment}</small><small>Código da ficha: ${t.id} ${t.status==='redeemed'?'| Retirada por '+t.redeemed_by:''}</small></div>${t.status==='pending'?`<button class="btn" onclick="redeem(${t.id})">CONFIRMAR RETIRADA</button>`:'<strong>RETIRADA</strong>'}</article>`).join(''):'<div class="box">Nenhuma ficha encontrada.</div>';}
async function redeem(id){if(!confirm('Confirmar a entrega desta unidade?'))return;try{await call('/api/garcom/pickup-tickets/'+id+'/redeem',{method:'POST',body:'{}'});await loadTickets();}catch(e){alert(e.message);}}
if(token)start(null);
</script></body></html>
