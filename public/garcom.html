<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14251e"><title>Garçom | Espetinho do Reinaldo</title><link rel="stylesheet" href="/garcom.css"><style>/* Ajustes responsivos da lista e dos itens da comanda */#itemList{width:100%;min-width:0}#itemList .item-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;width:100%!important;box-sizing:border-box!important;gap:10px!important}#itemList .item-row>div,#itemList .item-row>span{min-width:0!important;width:100%!important;overflow-wrap:anywhere!important;word-break:normal!important}#itemList .item-row button{width:auto!important;min-width:84px!important;max-width:96px!important;flex:none!important}#products{display:block!important;width:100%!important;min-width:0!important}#products .presentation-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto 44px!important;width:100%!important;min-width:0!important;box-sizing:border-box!important}#products .presentation-row>div{min-width:0!important;overflow-wrap:anywhere!important;word-break:normal!important}#products .presentation-row button{width:44px!important;min-width:44px!important;max-width:44px!important;flex:none!important;padding:0!important}@media(max-width:420px){#products .presentation-row{grid-template-columns:minmax(0,1fr) auto 42px!important;gap:7px!important;padding:10px!important}#products .presentation-row button{width:42px!important;min-width:42px!important;max-width:42px!important}}</style></head><body><header><div><small>ESPETINHO DO REINALDO</small><h1>Área do Garçom</h1></div><button id="logout" class="ghost hidden">Sair</button></header><main><section id="login" class="panel"><h2>Entrar</h2><label>Número do garçom<input id="number" inputmode="numeric" value="01" autocomplete="username"></label><label>PIN de acesso<input id="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="current-password" placeholder="4 ou 6 dígitos"></label><button id="loginBtn" class="primary">Entrar no sistema</button><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="welcome"><div><b id="who"></b><span>Área de atendimento</span></div><button id="refresh" class="ghost">Atualizar</button></div><div class="tabs"><button class="tab active" data-tab="orders">Comandas</button><button class="tab" data-tab="new">Nova comanda</button></div><section id="orders" class="panel tabbody"><h2>Comandas abertas</h2><div id="commandList" class="command-list"></div></section><section id="new" class="panel tabbody hidden"><h2>Abrir comanda</h2><label>Nome do cliente (opcional)<input id="customer" placeholder="Nome do cliente"></label><label>Mesa / identificação (opcional)<input id="table" placeholder="Ex.: Mesa 3"></label><button id="openCommand" class="primary">Abrir comanda</button><p id="newMsg" class="msg"></p></section><section id="detail" class="panel hidden"><button id="back" class="ghost">← Voltar às comandas</button><h2 id="commandTitle">Comanda</h2><p id="commandMeta" class="muted"></p><div id="itemList"></div><div class="total" id="commandTotal"></div><hr><h3>Adicionar produtos</h3><div class="scan-tools"><input id="search" placeholder="Buscar por nome, código ER ou código de barras..." aria-label="Buscar produto"><button id="scanCommandBarcode" type="button" class="scan-btn">📷 Ler código de barras</button></div><div id="categories" class="categories"></div><div id="products" class="products"></div><div class="cart" id="cart"></div><button id="sendItems" class="primary" disabled style="display:none">Enviar itens para a comanda</button><p id="itemMsg" class="msg"></p><button id="requestClose" class="danger">Solicitar fechamento da conta</button></section></section></main><div id="barcodeScanner" class="scanner-modal hidden" role="dialog" aria-modal="true" aria-label="Leitor de código de barras"><div class="scanner-card"><div class="scanner-head"><b>Leitura de código de barras</b><button id="closeBarcodeScanner" type="button" class="ghost">Fechar</button></div><p id="scannerMessage" class="muted">Aponte a câmera para o código do produto.</p><video id="barcodeVideo" playsinline muted></video><div id="scannerManual" class="scanner-manual hidden"><label>Digite o código manualmente<input id="manualBarcode" inputmode="numeric" autocomplete="off"></label><button id="manualBarcodeUse" type="button" class="primary">Localizar produto</button></div></div></div><div id="toast" role="status"></div><script src="/garcom.js?v=20261108-layout-corrigido-v5"></script></body></html>
