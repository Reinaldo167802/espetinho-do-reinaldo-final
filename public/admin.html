<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel - Espetinho do Reinaldo</title><link rel="stylesheet" href="/style.css"><style>body{padding-bottom:40px}.admin{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.nav button{padding:10px;border:0;border-radius:10px}.panel{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row>*{padding:10px;border:1px solid #ddd;border-radius:8px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}.danger{background:#a52a2a;color:#fff}.ok{background:#2e7d32;color:#fff}</style></head><body><header><div><b>🍢 PAINEL ADMINISTRATIVO</b><small>Espetinho do Reinaldo V4</small></div></header><div class="admin"><div id="login" class="panel"><h2>Entrar</h2><input id="pw" type="password" placeholder="Senha administrativa" style="padding:12px;width:100%"><button class="primary" style="margin-top:10px" onclick="login()">ENTRAR</button></div><div id="app" style="display:none"><div class="nav"><button onclick="tab('orders')">Pedidos</button><button onclick="tab('products')">Produtos</button><button onclick="tab('cash')">Caixa</button><button onclick="tab('commands')">Comandas</button></div><section id="orders" class="panel"><h2>Pedidos</h2><div id="ordersList"></div></section><section id="products" class="panel" style="display:none"><h2>Produtos</h2><div class="row"><input id="pn" placeholder="Nome"><input id="pc" placeholder="Categoria"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pi" placeholder="URL da foto"><input id="pd" placeholder="Descrição"></div><button class="primary" style="margin-top:8px" onclick="addProduct()">CADASTRAR PRODUTO</button><div id="productsList"></div></section><section id="cash" class="panel" style="display:none"><h2>Caixa</h2><div id="cashSummary"></div><div class="row"><select id="ct"><option value="entrada">Entrada</option><option value="saida">Saída</option></select><input id="cd" placeholder="Descrição"><input id="cv" type="number" step="0.01" placeholder="Valor"><select id="cp"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option></select></div><button class="primary" style="margin-top:8px" onclick="addCash()">LANÇAR NO CAIXA</button><div id="cashList"></div></section><section id="commands" class="panel" style="display:none"><h2>Comandas</h2><div class="row"><input id="cn" placeholder="Número da comanda"><input id="cc" placeholder="Cliente"></div><button class="primary" style="margin-top:8px" onclick="addCommand()">ABRIR COMANDA</button><div id="commandsList"></div></section></div></div><script src="/admin.js"></script></body></html>
